<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a1020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>小汐 · 鲸鱼桌宠</title>
<style>
:root{
  --ui:#eaf2ff; --ui-dim:#9fb4d6; --accent:#7fc4ff; --accent2:#4a86e8;
  --panel:rgba(14,22,40,.62); --line:rgba(150,190,255,.22);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#070b14}
body{
  font:500 14px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;
  color:var(--ui); user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  touch-action:none; overscroll-behavior:none;
}
#stage{position:fixed;inset:0;overflow:hidden;touch-action:none}

/* ---------- wallpaper ---------- */
#wall{position:absolute;inset:0;background:
  radial-gradient(110% 70% at 72% 6%,rgba(70,110,180,.55) 0%,rgba(70,110,180,0) 58%),
  radial-gradient(120% 85% at 50% 104%,rgba(126,178,240,.34) 0%,rgba(126,178,240,0) 62%),
  linear-gradient(180deg,#0c1730 0%,#16294c 34%,#254576 68%,#3f6ba6 100%);
  background-size:cover;background-position:center;transition:filter .4s}
#wall.custom{background-image:var(--wall-img);filter:saturate(.92) brightness(.86)}
#wall::after{content:"";position:absolute;inset:0;
  background:radial-gradient(85% 62% at 50% 112%,rgba(6,12,26,.46),transparent 72%),
             radial-gradient(140% 100% at 50% 42%,transparent 46%,rgba(4,9,20,.40) 100%);
  pointer-events:none}
#bokeh{position:absolute;inset:0;pointer-events:none;opacity:.85;
  background-image:
    radial-gradient(2.2px 2.2px at 18% 14%,rgba(190,224,255,.85),transparent 60%),
    radial-gradient(1.6px 1.6px at 72% 9%,rgba(190,224,255,.6),transparent 60%),
    radial-gradient(2.6px 2.6px at 86% 26%,rgba(160,205,255,.55),transparent 60%),
    radial-gradient(1.4px 1.4px at 34% 30%,rgba(210,235,255,.5),transparent 60%),
    radial-gradient(2px 2px at 56% 20%,rgba(180,220,255,.45),transparent 60%),
    radial-gradient(1.5px 1.5px at 9% 42%,rgba(180,220,255,.4),transparent 60%),
    radial-gradient(2.4px 2.4px at 64% 41%,rgba(160,205,255,.35),transparent 60%),
    radial-gradient(1.3px 1.3px at 44% 52%,rgba(200,230,255,.3),transparent 60%);
  animation:twinkle 6.5s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.45}to{opacity:.95}}
#glow{position:absolute;left:50%;bottom:-16%;width:120%;height:46%;transform:translateX(-50%);
  background:radial-gradient(50% 60% at 50% 100%,rgba(90,160,255,.20),transparent 72%);pointer-events:none}
/* desk edge the pet stands on */
#desk{position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,rgba(140,200,255,.30),transparent);opacity:.5}

/* ---------- pet ---------- */
#pet{position:absolute;left:0;top:0;will-change:transform;transform-origin:50% 100%;z-index:5;
  filter:drop-shadow(0 10px 18px rgba(0,0,0,.45))}
#pet.tilt-soft{filter:drop-shadow(0 8px 14px rgba(0,0,0,.4)) blur(.2px)}
#inner{position:relative;width:100%;height:100%;transform-origin:50% 100%;will-change:transform}
#inner img{position:absolute;inset:0;width:100%;height:100%;display:block;
  -webkit-user-drag:none;pointer-events:none}
/* The blink frame is cross-faded while it is squashed towards the eye line, so
   the lid reads as dropping shut instead of the whole frame popping in. */
#blink{opacity:0;transform-origin:50% var(--eye-y,34%);
  transform:scaleY(.55);transition:opacity .075s linear,transform .10s cubic-bezier(.3,.85,.4,1)}
#pet.blinking #blink{opacity:1;transform:scaleY(1)}

/* the whale coin she sneaks out of her apron pocket */
#coin{position:absolute;width:12.5%;height:12.5%;pointer-events:none;z-index:6;opacity:0;
  transform:translate(-50%,-50%) scale(0);will-change:transform,opacity;
  filter:drop-shadow(0 4px 7px rgba(0,0,0,.42))}
#coin img{width:100%;height:100%;display:block}
#shadow{position:absolute;left:50%;bottom:0;width:64%;height:5%;transform:translateX(-50%) scaleY(.5);
  background:radial-gradient(50% 50% at 50% 50%,rgba(0,0,0,.5),transparent 70%);filter:blur(4px);pointer-events:none}

/* idle / state loops */
@keyframes bob{from{transform:translateY(0) rotate(0)}to{transform:translateY(-1.1%) rotate(.4deg)}}
@keyframes walk{0%{transform:translateY(0) rotate(-1.6deg)}50%{transform:translateY(-3.2%) rotate(0)}100%{transform:translateY(0) rotate(1.6deg)}}
@keyframes breathe{from{transform:scale(1)}to{transform:scale(1.022) translateY(-.6%)}}
@keyframes shake{0%,100%{transform:translateX(0) rotate(0)}20%{transform:translateX(-2.5%) rotate(-2deg)}
  40%{transform:translateX(2.5%) rotate(2deg)}60%{transform:translateX(-2%) rotate(-1.4deg)}80%{transform:translateX(2%) rotate(1.4deg)}}
#inner.s-bob{animation:bob 2.9s ease-in-out infinite alternate}
#inner.s-walk{animation:walk .40s ease-in-out infinite}
#inner.s-sleep{animation:breathe 4.2s ease-in-out infinite alternate}
#inner.s-happy{animation:bob 1.1s ease-in-out infinite alternate}
#inner.s-shake{animation:shake .42s ease-in-out 2}
#inner.s-struggle{animation:shake .5s ease-in-out infinite}

/* ---------- speech bubble ---------- */
#bubble{position:absolute;left:0;top:0;max-width:min(78vw,360px);padding:10px 14px;z-index:14;
  background:linear-gradient(180deg,rgba(255,255,255,.97),rgba(233,242,255,.94));color:#16223c;
  border-radius:16px;font-size:14px;font-weight:600;line-height:1.5;letter-spacing:.2px;
  box-shadow:0 10px 26px rgba(0,0,0,.42),0 0 0 1px rgba(120,170,255,.35) inset;
  opacity:0;transform-origin:50% 100%;transform:translate(-50%,-100%) scale(.88);
  transition:opacity .18s,transform .22s cubic-bezier(.2,1.5,.4,1);
  pointer-events:none;will-change:transform}
#bubble.show{opacity:1;transform:translate(-50%,-100%) scale(1)}
#bubble.up{transform-origin:50% 0;transform:translate(-50%,0) scale(.88)}
#bubble.up.show{transform:translate(-50%,0) scale(1)}
#bubble::after{content:"";position:absolute;left:50%;bottom:-6px;width:13px;height:13px;margin-left:-6px;
  transform:rotate(45deg);border-radius:0 0 4px 0;
  background:rgba(240,246,255,.96);box-shadow:2px 2px 6px rgba(0,0,0,.16)}
#bubble.up::after{bottom:auto;top:-6px;border-radius:4px 0 0 0;box-shadow:-2px -2px 6px rgba(0,0,0,.12)}

/* ---------- particles ---------- */
.fx{position:absolute;z-index:8;font-size:22px;pointer-events:none;will-change:transform,opacity;
  transform:translate(-50%,-50%);filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.fx.candy{font-size:26px}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;z-index:10;pointer-events:none;transition:opacity .35s}
#hud.hidden{opacity:0!important}
#hud.dim .panel,#hud.dim .dock,#hud.dim #eye{opacity:.3}
.panel,.dock,#eye{transition:opacity .5s}
#hud>*{pointer-events:auto}
.panel{position:absolute;top:calc(10px + var(--safe-t));left:10px;width:186px;padding:10px 12px 11px;
  background:var(--panel);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(12px) saturate(1.3);
  -webkit-backdrop-filter:blur(12px) saturate(1.3);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.panel h1{margin:0;font-size:15px;font-weight:800;letter-spacing:.5px;display:flex;align-items:center;gap:6px}
.panel h1 em{font-style:normal;font-size:10px;font-weight:700;color:#0b1730;background:linear-gradient(135deg,#9fd4ff,#5aa8ff);
  padding:2px 6px;border-radius:20px}
.stat{margin-top:7px;font-size:10.5px;color:var(--ui-dim);letter-spacing:.3px}
.stat .bar{height:7px;margin-top:3px;border-radius:6px;background:rgba(255,255,255,.10);overflow:hidden;position:relative}
.stat .bar i{display:block;height:100%;width:0;border-radius:6px;transition:width .5s cubic-bezier(.2,.9,.3,1)}
.bar.aff i{background:linear-gradient(90deg,#ff8fc0,#ff5f9e)}
.bar.full i{background:linear-gradient(90deg,#ffd479,#ffa32e)}
.bar.eng i{background:linear-gradient(90deg,#8de6c3,#37b98d)}
.stat b{float:right;font-weight:700;color:#dbe8ff}

.dock{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(12px + var(--safe-b));
  display:flex;gap:5px;padding:6px;border-radius:22px;background:var(--panel);border:1px solid var(--line);
  backdrop-filter:blur(12px) saturate(1.3);-webkit-backdrop-filter:blur(12px) saturate(1.3);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.dock button{width:min(46px,11.6vw);height:min(46px,11.6vw);border:0;border-radius:16px;background:rgba(255,255,255,.07);color:var(--ui);
  font-size:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  transition:transform .12s,background .2s;cursor:pointer}
.dock button i{font-style:normal;line-height:1}
.dock button span{font-size:8.5px;font-weight:700;color:var(--ui-dim);letter-spacing:.2px}
.dock button:active{transform:scale(.9);background:rgba(127,196,255,.28)}
.dock button.on{background:linear-gradient(160deg,rgba(127,196,255,.38),rgba(74,134,232,.30))}

#eye{position:absolute;top:calc(10px + var(--safe-t));right:10px;width:44px;height:44px;border:1px solid var(--line);
  border-radius:14px;background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  color:var(--ui);font-size:17px;cursor:pointer}
#toast{position:absolute;left:50%;bottom:calc(96px + var(--safe-b));transform:translate(-50%,8px);opacity:0;
  padding:8px 14px;border-radius:14px;background:rgba(10,18,34,.82);border:1px solid var(--line);
  font-size:12px;transition:.25s;pointer-events:none;max-width:82vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#hint{position:absolute;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%);width:min(84vw,330px);
  padding:11px 13px;border-radius:16px;background:rgba(10,18,34,.86);border:1px solid var(--line);font-size:11.5px;
  line-height:1.6;color:#cfe0ff;z-index:15;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#hint button{margin-top:8px;width:100%;padding:8px;border:0;border-radius:11px;font-weight:800;font-size:12px;
  background:linear-gradient(135deg,#9fd4ff,#4a86e8);color:#08152c}
#hint.gone{display:none}
</style>
</head>
<body>
<div id="stage">
  <div id="wall"></div>
  <div id="bokeh"></div>
  <div id="glow"></div>
  <div id="desk"></div>

  <div id="pet">
    <div id="inner" class="s-bob">
      <img id="sprite" alt="小汐">
      <img id="blink" alt="">
      <div id="coin"><img id="coinImg" alt=""></div>
      <div id="shadow"></div>
    </div>
  </div>

  <div id="bubble"></div>

  <div id="hud">
    <div class="panel">
      <h1>小汐 <em id="lvText">Lv.1</em></h1>
      <div class="stat">亲密 <b id="affN">0</b><div class="bar aff"><i id="affB"></i></div></div>
      <div class="stat">饱食 <b id="fullN">0</b><div class="bar full"><i id="fullB"></i></div></div>
      <div class="stat">精力 <b id="engN">0</b><div class="bar eng"><i id="engB"></i></div></div>
    </div>
    <button id="eye" title="隐藏界面">👁</button>
    <div class="dock" id="dock">
      <button data-act="feed"><i>🍬</i><span>喂食</span></button>
      <button data-act="coin"><i>🪙</i><span>鲸鱼币</span></button>
      <button data-act="pet"><i>🖐</i><span>摸摸</span></button>
      <button data-act="talk"><i>💬</i><span>说话</span></button>
      <button data-act="wall"><i>🖼</i><span>壁纸</span></button>
      <button data-act="mute"><i>🔊</i><span>音效</span></button>
      <button data-act="full"><i>⛶</i><span>全屏</span></button>
    </div>
    <div id="toast"></div>
    <div id="hint" class="gone"></div>
  </div>
  <input id="file" type="file" accept="image/*" style="display:none">
</div>

/* ---------------- state ---------------- */
var KEY = "xiaoxi.pet.v1";
var S = {
  aff: 12, full: 72, energy: 84, mute:false, wall:null, born:Date.now(), last:Date.now(), seen:false, pets:0, feeds:0
};
function load(){
  try{ var raw = localStorage.getItem(KEY); if(raw){ var o=JSON.parse(raw);
    for(var k in S) if(k in o) S[k]=o[k];
  } }catch(e){}
}
function save(){
  S.last = Date.now();
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
}
load();

// offline decay: the pet gets hungry / sleepy while you are away
(function offline(){
  var away = Math.min((Date.now() - (S.last||Date.now()))/3600000, 12); // hours, capped
  if(away > 0.05){
    S.full   = clamp(S.full   - away*9, 0, 100);
    S.energy = clamp(S.energy - away*6, 0, 100);
  }
})();

function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function rnd(a,b){ return a + Math.random()*(b-a); }
function pick(a){ return a[(Math.random()*a.length)|0]; }

/* ---------------- audio (synthesised, no assets) ---------------- */
var AC=null;
function ac(){
  if(S.mute) return null;
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(AC.state==="suspended") AC.resume();

  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);

/* ---------------- geometry / physics ---------------- */
var W=0,H=0, GROUND=0, SIZE=0;
var P = { x:0, y:0, vx:0, vy:0, face:1, tilt:0, mode:"idle", tgt:null, walking:false, held:false, sinceHit:0 };

function measure(){
  W = stage.clientWidth; H = stage.clientHeight;
  SIZE = Math.round(clamp(Math.min(W*0.78, H*0.38), 170, 330));
  petEl.style.width = SIZE+"px"; petEl.style.height = SIZE+"px";
  // she stands on a "desk edge" just above the button dock, so the dock never
  // covers her feet; the sprite canvas has a small empty margin under them
  var dockH = 0;
  var de = $("#dock");
  if(de && de.getBoundingClientRect){ try{ dockH = de.getBoundingClientRect().height || 0; }catch(e){} }
  GROUND = H - Math.round(dockH + 10) + Math.round(SIZE*0.011);
  var deskEl = $("#desk");
  if(deskEl) deskEl.style.bottom = Math.round(dockH + 10) + "px";
  P.x = clamp(P.x||W*0.62, SIZE*0.35, W-SIZE*0.35);
  P.y = Math.min(P.y||GROUND, GROUND);
}
function place(){
  petEl.style.transform = "translate3d("+(P.x - SIZE/2).toFixed(1)+"px,"+(P.y - SIZE).toFixed(1)+"px,0) "+
    "rotate("+P.tilt.toFixed(2)+"deg) scaleX("+P.face+")";
  var sc = 1 - clamp((GROUND - P.y)/(SIZE*2.2), 0, .55);
  $("#shadow").style.transform = "translateX(-50%) scale("+sc.toFixed(2)+","+(sc*0.9).toFixed(2)+")";
  $("#shadow").style.opacity = (0.25 + sc*0.6).toFixed(2);
}

/* ---------------- speech ---------------- */
var sayTimer=null;
function say(text, ms){
  bubble.textContent = text;
  var bx = clamp(P.x, 104, W-104);
  bubble.style.left = bx+"px";
  var headY = P.y - SIZE*0.90;          // just above her head
  if(headY < 116){                       // not enough room above -> flip below
    bubble.classList.add("up");
    bubble.style.top = (P.y - SIZE*0.30)+"px";
  } else {
    bubble.classList.remove("up");
    bubble.style.top = headY+"px";
  }
  bubble.classList.add("show");
  clearTimeout(sayTimer);
  sayTimer = setTimeout(function(){ bubble.classList.remove("show"); }, ms||3200);
}

/* ---------------- particles ---------------- */
function fx(txt, opt){
  opt = opt||{};
  var ox = (opt.dx!==undefined?opt.dx:rnd(-SIZE*0.26,SIZE*0.26));
  var oy = (opt.dy!==undefined?opt.dy:rnd(-SIZE*0.72,-SIZE*0.30));
  var el = document.createElement("div");
  el.className = "fx"+(opt.cls?" "+opt.cls:"");
  el.textContent = txt;
  el.style.left = (P.x+ox)+"px"; el.style.top = (P.y+oy)+"px";
  el.style.fontSize = (opt.size||22)+"px";
  stage.appendChild(el);
  var dx = ox + rnd(-24,24), dy = oy - rnd(52,110);
  el.animate([
    { transform:"translate(-50%,-50%) scale(.4) rotate(0deg)", opacity:0 },
    { transform:"translate(calc(-50% + "+dx*0.3+"px),calc(-50% + "+dy*0.3+"px)) scale(1.15) rotate("+rnd(-14,14)+"deg)", opacity:1, offset:.28 },
    { transform:"translate(calc(-50% + "+dx+"px),calc(-50% + "+dy+"px)) scale(1) rotate("+rnd(-24,24)+"deg)", opacity:0 }
  ], { duration: opt.dur||1400, easing:"cubic-bezier(.22,.8,.3,1)" }).onfinish = function(){ el.remove(); };
}
function burst(list,n){ for(var i=0;i<(n||5);i++){ (function(i){ setTimeout(function(){ fx(pick(list)); }, i*70); })(i); } }

// pick a line without repeating the previous one from the same list
function pickL(a){
  if(!a || !a.length) return "";
  if(a.length === 1) return a[0];
  for(var i=0;i<8;i++){ var v=a[(Math.random()*a.length)|0]; if(v!==a._last){ a._last=v; return v; } }
  return a[0];
}
function levelOf(a){ return clamp(Math.floor(a/20)+1, 1, 5); }
var LVNAME = ["","陌生","熟悉","亲近","喜欢","最喜欢"];

/* ---------------- HUD ---------------- */
function renderHUD(){
  var lv = levelOf(S.aff);
  $("#lvText").textContent = "Lv."+lv+" "+LVNAME[lv];
  $("#affN").textContent = Math.round(S.aff);
  $("#fullN").textContent = Math.round(S.full);
  $("#engN").textContent = Math.round(S.energy);
  $("#affB").style.width = S.aff+"%";
  $("#fullB").style.width = S.full+"%";
  $("#engB").style.width = S.energy+"%";
}
function gainAff(v){

  var after = levelOf(S.aff);
  renderHUD();
  if(after>before){ setTimeout(function(){ SFX.levelup(); say(L.level[after]||"……嗯。",4200); burst(["⭐","✨","❤️"],9); },700); }
}
function toast(t){

var state = { sleep:false, blinkT:0, nextBlink:rnd(2000,5200), nextIdle:rnd(9000,20000),
              nextChat:rnd(28000,60000), nextWander:rnd(3000,7000), petHold:0, tapCount:0, lastTap:0,
              chewing:0, sinceSleepCheck:0, coinBusy:false, nextCoin:rnd(26000,52000) };
function setClass(c){ inner.className = c; }
function idleClass(){ if(state.sleep) setClass("s-sleep"); else setClass("s-bob"); }

function doBlink(){

/* ---------------- the whale coin ----------------

function spritePx(lm){ return { x:(lm[0]-0.5)*SIZE, y:(lm[1]-0.5)*SIZE }; }
function coinSnack(auto){

    ], { duration:520, easing:"cubic-bezier(.35,0,.4,1)", fill:"forwards" });
    a.onfinish = function(){
      SFX.crunch();

                      { transform:"translate(-50%,-50%) scale(.1)", opacity:0 }],

/* ---------------- pointer ---------------- */
var drag = null, lastTapT = 0;
function localPt(e){
  var r = stage.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
petEl.addEventListener("pointerdown", function(e){
  if(e.button!==undefined && e.button!==0) return;
  petEl.setPointerCapture && petEl.setPointerCapture(e.pointerId);
  var p = localPt(e);
  drag = { id:e.pointerId, x0:p.x, y0:p.y, lx:p.x, ly:p.y, t0:Date.now(), moved:0, holding:true, vx:0, vy:0 };
  P.held = true; P.vx = 0; P.vy = 0;
  wakeUp(true);
  P.mode = "drag";
  setClass("s-struggle");
  clearTimeout(drag.holdTimer);
  drag.holdTimer = setTimeout(function(){
    if(drag && drag.holding && drag.moved < 16){
      drag.petted = true; petHead();
      drag.heartTimer = setInterval(function(){ if(drag && drag.holding && drag.petted){ fx("❤️",{dy:-SIZE*0.66,size:16}); gainAff(0.9); } }, 900);
    }
  }, 520);
  e.preventDefault();
}, {passive:false});

window.addEventListener("pointermove", function(e){
  if(!drag || e.pointerId!==drag.id) return;
  var p = localPt(e);
  var dx = p.x - drag.lx, dy = p.y - drag.ly;
  drag.moved += Math.abs(dx) + Math.abs(dy);
  drag.vx = drag.vx*0.6 + dx*0.4;
  drag.vy = drag.vy*0.6 + dy*0.4;
  if(drag.moved > 16 && drag.holdTimer){ clearTimeout(drag.holdTimer); drag.holdTimer=null; drag.petted=false; }
  if(drag.moved > 44 && !drag.said){ drag.said = true; say(pickL(L.drag), 2200); }
  P.x = p.x; P.y = clamp(p.y, 40, GROUND+40);
  P.tilt = clamp(dx*2.2 + P.tilt*0.55, -15, 15);
  drag.lx = p.x; drag.ly = p.y;
  place();
  if(drag.moved > 220 && Math.random()<0.02) fx("💦",{size:16});
}, {passive:false});

window.addEventListener("pointerup", function(e){
  if(!drag || e.pointerId!==drag.id) return;
  if(drag.holdTimer) clearTimeout(drag.holdTimer);
  if(drag.heartTimer) clearInterval(drag.heartTimer);
  var dt = Date.now() - drag.t0, moved = drag.moved, wasPetted = drag.petted;
  var flingX = clamp((drag.vx||0)*11, -620, 620);
  drag = null; P.held = false;

  if(moved < 18 && dt < 420){
    P.mode = "idle"; P.vy = -300; P.vx = 0;
    idleClass();                       // drop the "being held" wiggle
    var now = Date.now();
    // count every tap first, so poking her repeatedly always reaches the angry reaction
    state.tapCount = (now - state.lastTap < 1400) ? state.tapCount+1 : 1;
    state.lastTap = now;
    if(state.tapCount >= 4){ state.tapCount = 0; anger(); return; }
    if(now - lastTapT < 320){ lastTapT = 0; P.vy = -180; spin(); }   // double tap = spin
    else { lastTapT = now; react(); }
    return;
  }
  P.mode = "fall"; P.vy = -30; P.vx = flingX;
  idleClass();
  if(wasPetted){ gainAff(0.8); }
  else { say(pickL(L.drop), 2200); gainAff(0.8); }
}, {passive:false});

function spin(){
  if(state.sleep) return;
  SFX.happy();
  inner.animate([{transform:"rotate(0)"},{transform:"rotate(360deg)"}],{duration:760,easing:"cubic-bezier(.3,.7,.3,1)"});
  burst(["⭐","✨","🌟","💫"],6);

/* ---------------- level / mood text ---------------- */
function moodLine(){
  if(S.energy < 18) return pickL(L.tired);
  if(S.full < 18) return pickL(L.hungry);
  if(S.aff > 82) return pickL(L.highAff);
  if(S.aff < 25) return pickL(L.lowAff);
  if(S.full > 92) return pickL(L.refuse);
  return pickL(L.idle);
}

/* ---------------- main loop ---------------- */
var last = performance.now();
function loop(now){
  var dt = Math.min((now-last)/1000, 0.05); last = now;
  var t = now;

  if(!P.held){
    if(P.mode==="drag") P.mode="fall";
    if(P.mode!=="fall" && P.mode!=="idle" && P.mode!=="walk") P.mode="idle";

    // gravity + horizontal fling
    if(P.y < GROUND || P.vy < 0){
      P.vy += 1900*dt;
      P.y += P.vy*dt;
      if(P.vx){ P.x += P.vx*dt; P.vx *= 0.97; if(Math.abs(P.vx)<8) P.vx = 0; }
      if(P.y >= GROUND){
        P.y = GROUND;
        if(P.vy > 260){ P.vy = -P.vy*0.26; SFX.land();
          inner.animate([{transform:"scale(1,1)"},{transform:"scale(1.10,.90)"},{transform:"scale(.97,1.03)"},{transform:"scale(1,1)"}],{duration:420,easing:"ease-out"});
        } else { P.vy = 0; P.vx = 0; if(P.mode!=="walk") P.mode="idle"; }
      }
    }
    // walking
    if(!state.sleep && P.y >= GROUND-0.5 && P.mode!=="fall"){
      if(!P.walking && t > state.nextWander && P.mode!=="drag"){
        P.walking = true; P.tgt = rnd(SIZE*0.34, W-SIZE*0.34);
        P.face = P.tgt > P.x ? 1 : -1;
        setClass("s-walk");
      }
      if(P.walking){
        var dir = P.tgt > P.x ? 1 : -1;
        P.x += dir * 58 * dt;
        if(Math.abs(P.tgt-P.x) < 6){
          P.walking = false; P.tgt=null; idleClass();
          state.nextWander = t + rnd(3200, 9000);
        }
      }
      P.tilt *= 0.86;
    } else if(P.y < GROUND-0.5){
      P.tilt = clamp(P.tilt + (P.vx||0)*0.002, -14, 14);
      P.tilt *= 0.97;
    }
  }
  P.x = clamp(P.x, SIZE*0.30, W-SIZE*0.30);
  place();

  // blink
  if(!state.sleep && t > state.nextBlink){ doBlink(); state.nextBlink = t + rnd(2200,5600); }

  // idle chatter
  if(!state.sleep && !P.held && t > state.nextChat){
    state.nextChat = t + rnd(30000, 75000);
    if(Math.random()<0.75){ say(moodLine(), 3400); fx(pick(["🎵","✨","💭"]),{dy:-SIZE*0.62,size:17}); }
  }
  // she sneaks a whale coin out of her pocket now and then
  if(!state.sleep && !P.held && !state.coinBusy && t > state.nextCoin){
    state.nextCoin = t + rnd(48000, 120000);
    if(S.full < 88 && Math.random() < 0.8) coinSnack(true);
  }
  // sleep logic
  if(S.energy <= 8 && !state.sleep) goSleep(true);

  requestAnimationFrame(loop);
}

/* ---------------- boot ---------------- */
function greet(){
  var h = new Date().getHours(), k;
  if(h<5) k="night"; else if(h<11) k="dawn"; else if(h<14) k="noon"; else if(h<18) k="aft"; else if(h<23) k="eve"; else k="night";
  say(pickL(L.greet[k]), 4200);

  // ---- first contact -------------------------------------------------------
  // Most people meet her as a file forwarded in a chat app. WeChat/QQ render
  // pages in an in-app browser where fullscreen and "add to home screen" are
  // missing — that is exactly the step that goes wrong — so say it up front.
  var ua = (navigator && navigator.userAgent) || "";
  var inWx = /MicroMessenger/i.test(ua);
  var inQQ = /QQ\/[\d.]+/.test(ua) && !/QQBrowser/i.test(ua);

  function showHint(html, label){
    hint.textContent = "";
    var t1 = document.createElement("div");
    t1.innerHTML = html;
    var ok = document.createElement("button");
    ok.id = "hintOk"; ok.textContent = label || "知道啦";
    ok.onclick = function(){
      hint.classList.add("gone");
      if(ok._next) setTimeout(ok._next, 900);
    };
    hint.appendChild(t1); hint.appendChild(ok);
    hint.classList.remove("gone");
    return ok;
  }

  if(inWx || inQQ){
    var who = inWx ? "微信" : "QQ";
    var b = showHint(
      "⚠️ <b>现在是在" + who + "里打开的</b><br>" +
      who + "内置浏览器不能用全屏、也加不了桌面图标，体验会差一截。<br><br>" +
      "点右上角 <b>···</b> →「<b>在浏览器打开</b>」，就能全屏养她了。", "好，我去浏览器打开");
    b._next = function(){
      if(!S.seen){ S.seen = true; save(); showHint(usageHint(), "知道啦"); }
    };
    return;
  }
  if(!S.seen){
    S.seen = true; save();
    setTimeout(function(){ showHint(usageHint(), "知道啦"); }, 3600);
  }
}

function onResize(){
  var oldG = GROUND;
  measure();
  if(P.y === oldG || P.y > GROUND) P.y = GROUND;
  place();
}
window.addEventListener("resize", onResize);
window.addEventListener("orientationchange", function(){ setTimeout(onResize, 260); });
if(window.visualViewport) window.visualViewport.addEventListener("resize", onResize);
